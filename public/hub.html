<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Meine Kurse</title>
  <meta name="theme-color" content="#0b0d14" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=6" />
  <link rel="shortcut icon" href="/favicon.ico?v=6" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
  <script>
    // Alte Schach-Links wie logineo.club/#casino führen weiter zum Schach
    if (/^#(play|bots|shop|inventory|casino|leaderboard|friends|replays|profile|admin|game|four)$/.test(location.hash)) location.replace('/chess/' + location.hash);
  </script>
  <style>
    :root { --bg: #0b0d14; --card: #141826; --line: rgba(255, 255, 255, .08); --text: #eef1f8; --muted: #9aa3b8; --grad: linear-gradient(135deg, #7c5cff, #22d3ee); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .glow { position: fixed; inset: -20%; z-index: -1; pointer-events: none; background: radial-gradient(40% 35% at 15% 10%, rgba(124, 92, 255, .22), transparent 70%), radial-gradient(35% 30% at 90% 20%, rgba(34, 211, 238, .14), transparent 70%), radial-gradient(40% 40% at 50% 110%, rgba(244, 63, 94, .1), transparent 70%); }
    main { max-width: 1100px; margin: 0 auto; padding: 56px 22px 40px; }
    h1 { font-size: clamp(34px, 6vw, 58px); margin: 0 0 8px; letter-spacing: -.02em; }
    h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); font-size: 18px; margin: 0 0 36px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .game { position: relative; display: grid; gap: 10px; padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .2s, box-shadow .2s, border-color .2s; overflow: hidden; }
    a.game:hover { transform: translateY(-4px); border-color: rgba(124, 92, 255, .6); box-shadow: 0 24px 50px -24px rgba(124, 92, 255, .6); }
    .game .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; background: var(--grad); }
    .game h2 { margin: 4px 0 0; font-size: 22px; }
    .game p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .game .go { margin-top: 6px; font-weight: 700; color: #a99bff; }
    .game.soon { opacity: .5; border-style: dashed; }
    .game.soon .ic { background: rgba(255, 255, 255, .06); }
    .tag { position: absolute; top: 16px; right: 16px; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: rgba(255, 255, 255, .08); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 50px; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <h1>Play<span>Hub</span></h1>
    <p class="sub">Such dir ein Spiel aus.</p>
    <div class="grid">
      <a class="game" href="/chess/">
        <span class="tag" style="background:rgba(52,211,153,.15);color:#6ee7a8">Online</span>
        <div class="ic">♞</div>
        <h2>SchachArena</h2>
        <p>Online-Schach mit Freunden, 2 vs 2, Bots, Rätsel des Tages, Shop, Casino und 3D-Finishern.</p>
        <span class="go">Spielen →</span>
      </a>
      <div class="game soon"><span class="tag">Bald</span><div class="ic">🎮</div><h2>Mehr Spiele</h2><p>Hier kommen bald weitere Spiele dazu.</p></div>
    </div>
    <footer>PlayHub</footer>
  </main>
</body>
</html>
