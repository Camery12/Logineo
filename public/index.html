<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SchachArena – Online Schach spielen</title>
  <meta name="description" content="Spiele Schach online mit Freunden per Code, im Zufalls-Match oder gegen Bots. Sammle Münzen, kaufe Bretter, Figuren und 3D-Finisher." />
  <meta name="theme-color" content="#0b0d14" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three-jsm/" } }
  </script>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <a class="logo" href="#play" data-view="play">
      <span class="logo-mark">♞</span>
      <span class="logo-text">Schach<b>Arena</b></span>
      <span class="ver-pill" id="ver-pill" title="Version"></span>
    </a>
    <nav class="nav">
      <button data-view="play" class="active"><span class="ni">⚔️</span><span>Spielen</span></button>
      <button data-view="bots"><span class="ni">🤖</span><span>Bots</span></button>
      <button data-view="shop"><span class="ni">🛒</span><span>Shop</span></button>
      <button data-view="leaderboard"><span class="ni">🏆</span><span>Rangliste</span></button>
      <button data-view="friends"><span class="ni">💬<b class="nav-badge" id="friends-badge" hidden></b></span><span>Freunde</span></button>
      <button data-view="replays"><span class="ni">🎬</span><span>Replays</span></button>
      <button data-view="profile"><span class="ni">👤</span><span>Profil</span></button>
    </nav>
    <div class="top-right">
      <span class="pill online-pill" title="Spieler online"><i class="dot"></i><span id="online-count">–</span></span>
      <button class="pill icon-btn" id="mute-btn" title="Ton an/aus">🔊</button>
      <span class="pill coin-pill" title="Deine Münzen"><i class="coin"></i><span id="coin-count">–</span></span>
      <button class="pill icon-btn" id="admin-btn" title="Admin-Menü" hidden>🛠️</button>
      <button class="btn sm primary login-btn" id="login-btn" hidden>🔑 <span>Anmelden</span></button>
      <button class="me-btn" data-view="profile" id="me-btn"></button>
    </div>
  </header>

  <main id="app">
    <section class="view active" id="view-play"></section>
    <section class="view" id="view-bots"></section>
    <section class="view" id="view-shop"></section>
    <section class="view" id="view-leaderboard"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-four"></section>
    <section class="view" id="view-friends"></section>
    <section class="view" id="view-replays"></section>
    <section class="view" id="view-admin"></section>
    <section class="view" id="view-game">
      <div class="game-layout">
        <div class="board-col">
          <div class="player-bar" id="bar-top"></div>
          <div class="board-frame"><div id="board"></div><div class="emote-pop" id="emote-pop"></div><div class="board-wait" id="board-wait" hidden></div></div>
          <div class="player-bar" id="bar-bottom"></div>
        </div>
        <aside class="side">
          <div class="card status-card">
            <div class="status-line" id="status-line">–</div>
            <div class="banner" id="game-banner" hidden></div>
          </div>
          <div class="card moves-card">
            <div class="card-head"><h3>Züge</h3><span class="muted" id="move-count"></span></div>
            <ol class="moves" id="moves"></ol>
          </div>
          <div class="card actions-card" id="game-actions"></div>
          <div class="card emotes" id="emotes"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-foot" id="site-foot"></footer>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <div id="notify-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
